services:
  celery_beat:
    build: .
    restart: always
    command: celery -A legal_clm beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
    - .:/app
  celery_worker:
    build: .
    restart: always
    command: celery -A legal_clm worker --loglevel=info
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
    - .:/app
  db:
    restart: always
    environment:
      POSTGRES_DB: legal_clm_db
      POSTGRES_PASSWORD: ClmSecure2026Pass!
      POSTGRES_USER: clm_user
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U clm_user
      timeout: 5s
    image: postgres:15-alpine
    volumes:
    - clm_clm_postgres_data:/var/lib/postgresql/data
  nginx:
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
    - 80:80
    expose:
    - 8000
    - 8001
    image: nginx:alpine
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1/healthz || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - static_volume:/app/staticfiles
    - media_volume:/app/media
  redis:
    restart: always
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis:7-alpine
  web:
    build: .
    restart: always
    command: gunicorn legal_clm.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120
    ports:
    - 8000:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).getcode()==200 else 1)"
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s
    volumes:
    - .:/app
    - static_volume:/app/staticfiles
    - media_volume:/app/media
volumes:
  media_volume: null
  clm_clm_postgres_data:
    external: true
  static_volume: null
