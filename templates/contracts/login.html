{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Login" %} - Legal CLM{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center" style="margin-top: 100px;">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2><i class="bi bi-file-earmark-text"></i> Legal CLM</h2>
                        <p class="text-muted">{% trans "Contract Lifecycle Management" %}</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">{% trans "Username" %}</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">{% trans "Password" %}</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> {% trans "Login" %}
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'password_reset' %}">{% trans "Forgot password?" %}</a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
