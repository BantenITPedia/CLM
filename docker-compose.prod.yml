services:
  db:
    image: postgres:15-alpine
    container_name: clm-db
    environment:
      POSTGRES_DB: legal_clm_db
      POSTGRES_USER: clm_user
      POSTGRES_PASSWORD: ClmSecure2026Pass!
    volumes:
    - clm_clm_postgres_data:/var/lib/postgresql/data
    networks:
    - clm
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clm_user"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: clm-redis
    networks:
    - clm
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: clm-app
    command: gunicorn legal_clm.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout
      120
    volumes:
    - clm_static_volume:/app/staticfiles
    - clm_media_volume:/app/media
    networks:
    - clm
    env_file:
    - .env.prod
    environment:
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).getcode()==200 else 1)\""]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s
    restart: always
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: clm-celery-worker
    command: celery -A legal_clm worker --loglevel=info --concurrency=2
    env_file:
    - .env.prod
    networks:
    - clm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: clm-celery-beat
    command: celery -A legal_clm beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
    - .env.prod
    networks:
    - clm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always
  nginx:
    image: nginx:alpine
    container_name: clm-nginx
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    - ./ssl:/etc/nginx/ssl:ro
    - clm_static_volume:/app/staticfiles:ro
    - clm_media_volume:/app/media:ro
    networks:
    - clm
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
volumes:
  clm_clm_postgres_data:
    external: true
  clm_static_volume: null
  clm_media_volume: null
networks:
  clm:
    driver: bridge
